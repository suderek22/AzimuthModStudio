; FH2 Mouse & Keyboard: a mouse cursor for Forza Horizon 2's menus, and keys to drive with. 0 = off, 1 = on.
; Left click = A (or select what's clicked), right click = B, wheel = up/down,
; mouse side buttons = LB/RB, middle click = right stick click. Help bar buttons
; are clickable. Map: drag to pan, click to select or set a waypoint, wheel to zoom.
; Garage: drag empty space to turn the camera, wheel to zoom; W A S D move a decal.
; Photo mode: drag to turn, W A S D to move, Q / E down / up, wheel to zoom.
[Mouse]
Enabled=1

; Moving the mouse over a button, list row or slider selects it.
HoverSelects=1

; Hide the cursor after this many seconds without moving the mouse (0 = never).
HideAfterSeconds=3

; The game's frame rate. 0 = measure it (the log says what it found). Set it (30, 60,
; 120, 144...) only if photo mode or the garage camera turns too fast or too slow.
FrameRate=0

; Log what is under the cursor to fh2-mods\platform.log.
Debug=0

; Keys for driving and the menus (also on Pause > Settings > MODS). One or more keys
; each, separated by spaces: A-Z, 0-9, F1-F24, Num0-Num9 (with Num Lock on), Left, Right,
; Up, Down, Space, Enter, Escape, Tab, Backspace, Insert, Delete, Home, End, PageUp,
; PageDown, Shift, LShift, RShift, Ctrl, LCtrl, RCtrl, Alt, LAlt, RAlt, Comma, Period,
; Minus, Equals, Semicolon, Slash, Grave, LBracket, Backslash, RBracket, Quote, or a
; virtual-key code (0xNN). None leaves an action without a key. The driving keys only
; work while driving and the menu ones only in the menus, so a key can be one of each.
; Enabled=0 turns the keys off.
[Keyboard]
Enabled=1
Gas=W
Brake=S
SteerLeft=Left
SteerRight=Right
Handbrake=Space
ShiftUp=A
ShiftDown=Z
Clutch=LAlt
Camera=C
LookBack=RCtrl
LookLeft=None
LookRight=None
Rewind=R
Map=M
PhotoMode=P
RadioPrevious=Comma
RadioNext=Period
Interact=Enter
Nitro=LCtrl
Pause=Escape
Accept=Enter
Back=Escape
Up=Up
Down=Down
Left=Left
Right=Right
PreviousTab=PageUp
NextTab=PageDown
